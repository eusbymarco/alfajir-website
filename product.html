<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Product details from ALFAJIR Electronics.">
  <title>Product Details | ALFAJIR</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="js/product-details.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html#home" aria-label="ALFAJIR home">
        <img class="brand-image" src="images/ALFAJIR LOGO.jpeg" alt="ALFAJIR logo">
      </a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
        <div class="category-navigation" id="category-navigation" aria-label="Shop by category"></div>
        <button class="cart-button" type="button" aria-label="View cart">
          <span class="cart-count" aria-live="polite">0</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 9H6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="20" r="1" fill="currentColor"/>
            <circle cx="18" cy="20" r="1" fill="currentColor"/>
          </svg>
        </button>
        <form class="search-form" role="search" aria-label="Search ALFAJIR" action="index.html">
          <label class="visually-hidden" for="site-search">Search ALFAJIR</label>
          <input id="site-search" name="q" type="search" placeholder="Search" autocomplete="off">
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.7"/>
              <path d="m15.5 15.5 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </nav>
    </div>
  </header>

  <main id="main-content" class="product-details-page section-wrap">
    <a class="back-to-catalog" href="index.html">← Back to shopping</a>
    <div id="product-details" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner section-wrap">
      <div class="footer-brand">
        <img src="images/ALFAJIR LOGO.jpeg" alt="ALFAJIR logo">
        <p>THE DAWN OF SMART LIVING</p>
      </div>
      <div class="footer-links">
        <div>
          <h3>Navigation</h3>
          <a href="index.html#home">Home</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </div>
        <div>
          <h3>Shop</h3>
          <a href="category.html?category=televisions">Televisions</a>
          <a href="category.html?category=refrigerators">Refrigerators</a>
          <a href="category.html?category=washing-machines">Washing Machines</a>
          <a href="category.html?category=sound-bars">Soundbars</a>
          <a href="category.html?category=chest-freezers">Chest Freezers</a>
          <a href="category.html?category=kitchen-appliances">Kitchen Appliances</a>
          <a href="category.html?category=home-appliances">Home Appliances</a>
        </div>
      </div>
    </div>
  </footer>

</html>
